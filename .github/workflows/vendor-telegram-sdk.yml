name: Apply self-hosted Telegram SDK experiment

on:
  push:
    branches:
      - experiment/self-host-telegram-sdk
    paths:
      - ".github/workflows/vendor-telegram-sdk.yml"

permissions:
  contents: write

jobs:
  apply-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: experiment/self-host-telegram-sdk

      - name: Point Mini App at vendored Telegram SDK
        run: |
          set -euo pipefail
          test -s miniapp/vendor/telegram-web-app.js
          grep -q 'window.Telegram.WebApp' miniapp/vendor/telegram-web-app.js
          python - <<'PY'
          from pathlib import Path
          path = Path('miniapp/index.html')
          text = path.read_text()
          old = '<script src="https://telegram.org/js/telegram-web-app.js"></script>'
          new = '<script src="/vendor/telegram-web-app.js"></script>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Telegram SDK tag, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cat > miniapp/telegram-sdk-hosting.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';

          const index=await readFile(new URL('./index.html',import.meta.url),'utf8');
          const sdk=await readFile(new URL('./vendor/telegram-web-app.js',import.meta.url),'utf8');

          test('Telegram WebApp SDK is self-hosted and loads before bootstrap',()=>{
            const sdkTag='<script src="/vendor/telegram-web-app.js"></script>';
            const bootstrapTag='<script type="module" src="/bootstrap.js"></script>';
            assert.match(index,/src="\/vendor\/telegram-web-app\.js"/);
            assert.doesNotMatch(index,/https:\/\/telegram\.org\/js\/telegram-web-app\.js/);
            assert.ok(index.indexOf(sdkTag)>=0);
            assert.ok(index.indexOf(sdkTag)<index.indexOf(bootstrapTag));
            assert.match(sdk,/window\.Telegram\.WebApp/);
          });
          EOF
          node --test miniapp/telegram-sdk-hosting.test.mjs

      - name: Commit experiment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add miniapp/index.html miniapp/telegram-sdk-hosting.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Load Telegram WebApp SDK locally'
          git push origin HEAD:experiment/self-host-telegram-sdk
