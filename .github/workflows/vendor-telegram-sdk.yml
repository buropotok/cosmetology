name: Fetch Telegram WebApp SDK

on:
  push:
    branches:
      - experiment/self-host-telegram-sdk
    paths:
      - ".github/workflows/vendor-telegram-sdk.yml"

permissions:
  contents: write

jobs:
  fetch-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: experiment/self-host-telegram-sdk

      - name: Fetch official Telegram WebApp SDK
        run: |
          set -euo pipefail
          mkdir -p miniapp/vendor
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 60 \
            'https://telegram.org/js/telegram-web-app.js?63' \
            --output miniapp/vendor/telegram-web-app.js
          test -s miniapp/vendor/telegram-web-app.js
          grep -q 'window.Telegram.WebApp' miniapp/vendor/telegram-web-app.js
          sha256sum miniapp/vendor/telegram-web-app.js

      - name: Commit SDK snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add miniapp/vendor/telegram-web-app.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Vendor Telegram WebApp SDK snapshot'
          git push origin HEAD:experiment/self-host-telegram-sdk
