name: Update self-hosted Telegram SDK test

on:
  push:
    branches:
      - experiment/self-host-telegram-sdk
    paths:
      - ".github/workflows/update-self-host-sdk-test.yml"

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: experiment/self-host-telegram-sdk
          fetch-depth: 1

      - name: Update obsolete bootstrap expectation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('worker/src/bootstrap.test.js')
          text = path.read_text()
          old = "expect(scriptSources).toContain('https://telegram.org/js/telegram-web-app.js');expect(miniappFile('composer-mockup.js'))"
          new = "expect(scriptSources).toContain('/vendor/telegram-web-app.js');expect(scriptSources).not.toContain('https://telegram.org/js/telegram-web-app.js');expect(miniappFile('composer-mockup.js'))"
          if old not in text:
              raise SystemExit('expected obsolete Telegram SDK assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- worker/src/bootstrap.test.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify vendored Telegram SDK snapshot
        run: |
          echo '3549138a7934039fe7dfd1291a4ee739bd2b705a614308053a8b08a87d85c451  miniapp/vendor/telegram-web-app.js' | sha256sum --check --strict
          grep -q 'src="/vendor/telegram-web-app.js"' miniapp/index.html
          ! grep -q 'https://telegram.org/js/telegram-web-app.js' miniapp/index.html

      - name: Run Mini App tests
        run: node --test miniapp/*.test.mjs

      - name: Run Worker tests
        run: npm test -w worker

      - name: Typecheck
        run: npm run typecheck -w worker

      - name: Build
        run: npm run build -w worker

      - name: Commit approved test update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/bootstrap.test.js
          git diff --cached --check
          git commit -m 'Update bootstrap test for self-hosted Telegram SDK'
          git push origin HEAD:experiment/self-host-telegram-sdk
