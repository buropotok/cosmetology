name: Test

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/**"
      - "miniapp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Mini App tests
        run: node --test miniapp/*.test.mjs

      - name: Run tests
        run: npm test -w worker

      - name: Typecheck
        run: npm run typecheck -w worker

      - name: Build
        run: npm run build -w worker
