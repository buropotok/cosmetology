name: Deploy Yandex VK

on:
  push:
    branches:
      - main
    paths:
      - "yandex/vk/**"
      - ".github/workflows/yandex-vk.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  YC_FUNCTION_NAME: cosmetology-social-publisher
  YC_FUNCTION_RUNTIME: nodejs22
  YC_FUNCTION_ENTRYPOINT: index.handler
  YC_FUNCTION_MEMORY: 128Mb
  YC_FUNCTION_TIMEOUT: "120"
  YC_FUNCTION_SOURCE_ROOT: yandex/vk/function
  YC_GATEWAY_NAME: cosmetology-social-publisher
  YC_GATEWAY_TEMPLATE: yandex/vk/gateway/openapi.yaml.tpl
  YC_GATEWAY_SPEC: /tmp/yandex-vk-openapi.yaml
  YC_BUCKET: cosmetology-publisher-images
  YC_MINIAPP_SOURCE: yandex/vk/miniapp
  YC_MINIAPP_PREFIX: miniapp

jobs:
  deploy-yandex-vk:
    if: ${{ vars.YC_FOLDER_ID != '' && vars.YC_DEPLOY_SA_ID != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        env:
          ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -d "$YC_FUNCTION_SOURCE_ROOT"
          test -f "$YC_FUNCTION_SOURCE_ROOT/index.js"
          test -f "$YC_FUNCTION_SOURCE_ROOT/package.json"
          test -d "$YC_MINIAPP_SOURCE"
          test -f "$YC_MINIAPP_SOURCE/index.html"
          test -f "$YC_GATEWAY_TEMPLATE"
          test -n "$ACCESS_KEY_ID" || (echo "Missing YC_S3_ACCESS_KEY_ID secret" && exit 1)
          test -n "$SECRET_ACCESS_KEY" || (echo "Missing YC_S3_SECRET_ACCESS_KEY secret" && exit 1)

      - name: Deploy Yandex Cloud Function
        id: deploy_function
        uses: yc-actions/yc-sls-function@v3.1.0
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          function-name: ${{ env.YC_FUNCTION_NAME }}
          runtime: ${{ env.YC_FUNCTION_RUNTIME }}
          entrypoint: ${{ env.YC_FUNCTION_ENTRYPOINT }}
          memory: ${{ env.YC_FUNCTION_MEMORY }}
          execution-timeout: ${{ env.YC_FUNCTION_TIMEOUT }}
          service-account-name: cf-service-account
          source-root: ${{ env.YC_FUNCTION_SOURCE_ROOT }}
          include: |
            **/*.js
            **/*.json
          environment: |
            AWS_ACCESS_KEY_ID=${{ secrets.YC_S3_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
            REPLICA_TOKEN=${{ secrets.YANDEX_REPLICA_TOKEN || 'not-configured' }}
          tags: |
            main

      - name: Upload VK Mini App to Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          set -euo pipefail
          aws --endpoint-url=https://storage.yandexcloud.net \
            s3 sync "$YC_MINIAPP_SOURCE/" "s3://$YC_BUCKET/$YC_MINIAPP_PREFIX/" \
            --delete

      - name: Get Yandex IAM token via GitHub OIDC
        env:
          YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
          OIDC_AUDIENCE: https://github.com/buropotok
        run: |
          set -euo pipefail
          OIDC_RESPONSE=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"

          IAM_RESPONSE=$(curl --fail-with-body -sS \
            -X POST https://auth.yandex.cloud/oauth/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_DEPLOY_SA_ID" \
            --data-urlencode "subject_token=$OIDC_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')
          IAM_TOKEN=$(printf '%s' "$IAM_RESPONSE" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        run: |
          set -euo pipefail
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n

          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
          "$HOME/yandex-cloud/bin/yc" version

      - name: Render API Gateway specification
        env:
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          YC="$HOME/yandex-cloud/bin/yc"
          "$YC" config set token "$YC_IAM_TOKEN"
          "$YC" config set folder-id "$YC_FOLDER_ID"

          FUNCTION_ID=$("$YC" serverless function get --name "$YC_FUNCTION_NAME" --format json | jq -r '.id')
          RUNTIME_SA_ID=$("$YC" iam service-account get --name cf-service-account --format json | jq -r '.id')
          test -n "$FUNCTION_ID" && test "$FUNCTION_ID" != "null"
          test -n "$RUNTIME_SA_ID" && test "$RUNTIME_SA_ID" != "null"

          sed \
            -e "s/__FUNCTION_ID__/$FUNCTION_ID/g" \
            -e "s/__RUNTIME_SA_ID__/$RUNTIME_SA_ID/g" \
            "$YC_GATEWAY_TEMPLATE" > "$YC_GATEWAY_SPEC"

          echo "function_id=$FUNCTION_ID"
          echo "runtime_service_account_id=$RUNTIME_SA_ID"

      - name: Deploy API Gateway specification
        env:
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          YC="$HOME/yandex-cloud/bin/yc"
          "$YC" serverless api-gateway update "$YC_GATEWAY_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --spec "$YC_GATEWAY_SPEC"

      - name: Verify Yandex deployment
        env:
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          YC="$HOME/yandex-cloud/bin/yc"
          echo "Function:"
          "$YC" serverless function get --name "$YC_FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq '{id,name,status}'
          echo "API Gateway:"
          "$YC" serverless api-gateway get "$YC_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq '{id,name,status,domain}'
          echo "Object Storage miniapp objects:"
          AWS_ACCESS_KEY_ID='${{ secrets.YC_S3_ACCESS_KEY_ID }}' \
          AWS_SECRET_ACCESS_KEY='${{ secrets.YC_S3_SECRET_ACCESS_KEY }}' \
          AWS_DEFAULT_REGION=ru-central1 \
          aws --endpoint-url=https://storage.yandexcloud.net \
            s3 ls "s3://$YC_BUCKET/$YC_MINIAPP_PREFIX/"
