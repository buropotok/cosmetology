name: Deploy Yandex VK

on:
  push:
    branches:
      - main
    paths:
      - "yandex/vk/function/**"
      - ".github/workflows/yandex-vk.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  YC_FUNCTION_NAME: cosmetology-social-publisher
  YC_FUNCTION_RUNTIME: nodejs22
  YC_FUNCTION_ENTRYPOINT: index.handler
  YC_FUNCTION_MEMORY: 128Mb
  YC_FUNCTION_TIMEOUT: "10"
  YC_FUNCTION_SOURCE_ROOT: yandex/vk/function

jobs:
  deploy-function:
    if: ${{ vars.YC_FOLDER_ID != '' && vars.YC_DEPLOY_SA_ID != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostic - workflow context
        env:
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
          YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
        run: |
          echo "repository=$GITHUB_REPOSITORY"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "event=$GITHUB_EVENT_NAME"
          echo "actor=$GITHUB_ACTOR"
          echo "workflow=$GITHUB_WORKFLOW"
          echo "job=$GITHUB_JOB"
          echo "folder_id=$YC_FOLDER_ID"
          echo "deploy_sa_id=$YC_DEPLOY_SA_ID"
          echo "expected_oidc_issuer=https://token.actions.githubusercontent.com"
          echo "expected_oidc_audience=https://github.com/buropotok"
          echo "expected_oidc_subject=repo:buropotok/cosmetology:ref:refs/heads/main"

      - name: Diagnostic - function source
        run: |
          echo "source_root=$YC_FUNCTION_SOURCE_ROOT"
          test -d "$YC_FUNCTION_SOURCE_ROOT" || (echo "ERROR: source root does not exist" && exit 1)
          find "$YC_FUNCTION_SOURCE_ROOT" -maxdepth 2 -type f -print | sort
          test -f "$YC_FUNCTION_SOURCE_ROOT/index.js" || (echo "ERROR: index.js missing" && exit 1)
          test -f "$YC_FUNCTION_SOURCE_ROOT/package.json" || (echo "ERROR: package.json missing" && exit 1)
          echo "package.json:"
          cat "$YC_FUNCTION_SOURCE_ROOT/package.json"

      - name: Validate runtime Object Storage credentials
        env:
          ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$ACCESS_KEY_ID" ]; then echo "YC_S3_ACCESS_KEY_ID=present"; else echo "YC_S3_ACCESS_KEY_ID=missing"; exit 1; fi
          if [ -n "$SECRET_ACCESS_KEY" ]; then echo "YC_S3_SECRET_ACCESS_KEY=present"; else echo "YC_S3_SECRET_ACCESS_KEY=missing"; exit 1; fi

      - name: Diagnostic - GitHub OIDC claims and Yandex token exchange
        continue-on-error: true
        env:
          YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
          EXPECTED_AUDIENCE: https://github.com/buropotok
          EXPECTED_SUBJECT: repo:buropotok/cosmetology:ref:refs/heads/main
        shell: bash
        run: |
          node <<'NODE'
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          const saId = process.env.YC_DEPLOY_SA_ID;
          const expectedAudience = process.env.EXPECTED_AUDIENCE;
          const expectedSubject = process.env.EXPECTED_SUBJECT;

          function decodeJwtPayload(token) {
            const part = token.split('.')[1];
            if (!part) throw new Error('OIDC token is not a JWT');
            const normalized = part.replace(/-/g, '+').replace(/_/g, '/');
            const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
            return JSON.parse(Buffer.from(padded, 'base64').toString('utf8'));
          }

          async function requestGithubToken(audience) {
            const url = new URL(requestUrl);
            if (audience) url.searchParams.set('audience', audience);
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${requestToken}` },
            });
            const text = await response.text();
            if (!response.ok) {
              console.log(`GitHub OIDC request failed: status=${response.status}`);
              console.log(text);
              return null;
            }
            const data = JSON.parse(text);
            return data.value;
          }

          async function exchangeWithYandex(label, token) {
            if (!token) return;
            const body = new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange',
              requested_token_type: 'urn:ietf:params:oauth:token-type:access_token',
              audience: saId,
              subject_token: token,
              subject_token_type: 'urn:ietf:params:oauth:token-type:id_token',
            });
            const response = await fetch('https://auth.yandex.cloud/oauth/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: body.toString(),
            });
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch { data = { raw: text }; }
            if (data && typeof data === 'object') {
              delete data.access_token;
              delete data.refresh_token;
            }
            console.log(`${label} Yandex exchange: status=${response.status}`);
            console.log(JSON.stringify(data));
          }

          async function main() {
            if (!requestUrl) {
              console.log('ACTIONS_ID_TOKEN_REQUEST_URL=missing');
              process.exitCode = 1;
              return;
            }
            if (!requestToken) {
              console.log('ACTIONS_ID_TOKEN_REQUEST_TOKEN=missing');
              process.exitCode = 1;
              return;
            }

            console.log('ACTIONS_ID_TOKEN_REQUEST_URL=present');
            console.log('ACTIONS_ID_TOKEN_REQUEST_TOKEN=present');

            const defaultToken = await requestGithubToken(null);
            if (defaultToken) {
              const claims = decodeJwtPayload(defaultToken);
              const safeClaims = {
                iss: claims.iss,
                aud: claims.aud,
                sub: claims.sub,
                repository: claims.repository,
                repository_owner: claims.repository_owner,
                ref: claims.ref,
                workflow: claims.workflow,
                job_workflow_ref: claims.job_workflow_ref,
                event_name: claims.event_name,
                actor: claims.actor,
              };
              console.log('default OIDC claims=' + JSON.stringify(safeClaims));
              console.log('default audience matches expected=' + String(claims.aud === expectedAudience));
              console.log('default subject matches expected=' + String(claims.sub === expectedSubject));
              await exchangeWithYandex('default-audience', defaultToken);
            }

            const explicitToken = await requestGithubToken(expectedAudience);
            if (explicitToken) {
              const claims = decodeJwtPayload(explicitToken);
              const safeClaims = {
                iss: claims.iss,
                aud: claims.aud,
                sub: claims.sub,
                repository: claims.repository,
                repository_owner: claims.repository_owner,
                ref: claims.ref,
                workflow: claims.workflow,
                job_workflow_ref: claims.job_workflow_ref,
                event_name: claims.event_name,
                actor: claims.actor,
              };
              console.log('explicit OIDC claims=' + JSON.stringify(safeClaims));
              console.log('explicit audience matches expected=' + String(claims.aud === expectedAudience));
              console.log('explicit subject matches expected=' + String(claims.sub === expectedSubject));
              await exchangeWithYandex('explicit-audience', explicitToken);
            }
          }

          main().catch((error) => {
            console.error('OIDC diagnostic failed:', error?.stack || error);
            process.exitCode = 1;
          });
          NODE

      - name: Deploy Yandex Cloud Function
        id: deploy
        uses: yc-actions/yc-sls-function@v3.1.0
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          function-name: ${{ env.YC_FUNCTION_NAME }}
          runtime: ${{ env.YC_FUNCTION_RUNTIME }}
          entrypoint: ${{ env.YC_FUNCTION_ENTRYPOINT }}
          memory: ${{ env.YC_FUNCTION_MEMORY }}
          execution-timeout: ${{ env.YC_FUNCTION_TIMEOUT }}
          service-account-name: cf-service-account
          source-root: ${{ env.YC_FUNCTION_SOURCE_ROOT }}
          include: |
            **/*.js
            **/*.json
          environment: |
            AWS_ACCESS_KEY_ID=${{ secrets.YC_S3_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          tags: |
            main

      - name: Diagnostic - deployment result
        if: always()
        run: |
          echo "deploy_step_outcome=${{ steps.deploy.outcome }}"
          echo "deploy_step_conclusion=${{ steps.deploy.conclusion }}"
          echo "function_name=$YC_FUNCTION_NAME"
          echo "runtime=$YC_FUNCTION_RUNTIME"
          echo "entrypoint=$YC_FUNCTION_ENTRYPOINT"
          echo "source_root=$YC_FUNCTION_SOURCE_ROOT"
