<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Диагностика VK ID</title>
  <meta name="description" content="Диагностическая страница авторизации VK ID.">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17223b;
      background: #f3f6fa;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 640px);
      padding: clamp(24px, 6vw, 48px);
      border: 1px solid #dce3ec;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(27, 43, 72, .1);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.1;
    }

    p { margin: 0; color: #657087; line-height: 1.6; }

    .widget { margin-top: 30px; }

    .result {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid #e3e8ef;
    }

    .result h2 { margin: 0 0 12px; font-size: 18px; }

    .status {
      display: inline-flex;
      margin-bottom: 14px;
      padding: 6px 11px;
      border-radius: 999px;
      background: #edf1f6;
      color: #526078;
      font-size: 13px;
      font-weight: 650;
    }

    .status.success { background: #e4f5e9; color: #176b35; }
    .status.error { background: #fde8e7; color: #a12420; }

    pre {
      max-height: 360px;
      margin: 0;
      overflow: auto;
      padding: 16px;
      border-radius: 14px;
      background: #111827;
      color: #e5edf9;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .note { margin-top: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Проверка VK ID</h1>
    <p>Диагностическая страница для проверки authorization flow приложения 54726533.</p>

    <div class="widget" id="vkid-widget">
      <script nonce="csp_nonce" src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
      <script nonce="csp_nonce" type="text/javascript">
        if ('VKIDSDK' in window) {
          const VKID = window.VKIDSDK;

          VKID.Config.init({
            app: 54726533,
            redirectUrl: 'https://buropotok.github.io/cosmetology/auth/',
            responseMode: VKID.ConfigResponseMode.Callback,
            source: VKID.ConfigSource.LOWCODE,
            scope: '',
          });

          const oneTap = new VKID.OneTap();

          oneTap.render({
            container: document.currentScript.parentElement,
            showAlternativeLogin: true
          })
          .on(VKID.WidgetEvents.ERROR, vkidOnError)
          .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
            const code = payload.code;
            const deviceId = payload.device_id;

            VKID.Auth.exchangeCode(code, deviceId)
              .then(vkidOnSuccess)
              .catch(vkidOnError);
          });

          function describeValue(value, key) {
            const sensitiveKey = /token|code|secret|password|hash/i.test(key || '');
            if (sensitiveKey && value != null) {
              return `[скрыто; тип: ${Array.isArray(value) ? 'array' : typeof value}]`;
            }
            if (value instanceof Error) {
              return { name: value.name, message: value.message };
            }
            if (Array.isArray(value)) {
              return value.map(function (item) { return describeValue(item, ''); });
            }
            if (value && typeof value === 'object') {
              return Object.keys(value).reduce(function (result, childKey) {
                result[childKey] = describeValue(value[childKey], childKey);
                return result;
              }, {});
            }
            return value;
          }

          function showResult(state, title, value) {
            const status = document.getElementById('auth-status');
            const output = document.getElementById('auth-result');
            status.className = `status ${state}`;
            status.textContent = title;
            output.textContent = JSON.stringify(value, null, 2);
          }

          function vkidOnSuccess(data) {
            const safeResult = describeValue(data, '');
            showResult('success', 'Авторизация выполнена', safeResult);
            console.info('VK ID authorization result structure:', safeResult);
          }

          function vkidOnError(error) {
            const safeError = describeValue(error, '');
            showResult('error', 'Ошибка авторизации', safeError);
            console.error('VK ID authorization error:', safeError);
          }
        } else {
          window.addEventListener('DOMContentLoaded', function () {
            const status = document.getElementById('auth-status');
            const output = document.getElementById('auth-result');
            status.className = 'status error';
            status.textContent = 'SDK не загрузился';
            output.textContent = 'Объект VKIDSDK недоступен. Проверьте загрузку SDK и соединение с сетью.';
          });
          console.error('VK ID SDK is unavailable.');
        }
      </script>
    </div>

    <section class="result" aria-live="polite" aria-labelledby="result-title">
      <h2 id="result-title">Результат</h2>
      <div class="status" id="auth-status">Ожидание авторизации</div>
      <pre id="auth-result">Результат или ошибка появятся здесь.</pre>
      <p class="note">Значения токенов, кодов и других чувствительных полей скрываются. Страница ничего не сохраняет и не отправляет на собственный backend.</p>
    </section>
  </main>
</body>
</html>
