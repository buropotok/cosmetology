<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>До / После</title><link rel="preload" href="/before-after.css" as="style"><link rel="stylesheet" href="/before-after.css"><link rel="preload" href="https://telegram.org/js/telegram-web-app.js" as="script"><link rel="preload" href="/before-after.js" as="script"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><header><button id="back" class="ghost">← Назад</button><strong>До / После</strong><button id="finish" disabled>Сохранить</button></header><main><div class="toolbar"><button data-layout="horizontal" class="selected">Лево / право</button><button data-layout="vertical">Верх / низ</button><button id="swap">⇄ Поменять</button></div><div id="slots" data-layout="horizontal"><button class="slot" data-slot="before"><span class="label">ДО</span><span class="empty">＋<small>Добавить фото</small></span><img></button><button class="slot" data-slot="after"><span class="label">ПОСЛЕ</span><span class="empty">＋<small>Добавить фото</small></span><img></button><img id="compositeResult" alt="Готовая композиция" hidden><div id="cropHandle" aria-label="Обрезать снизу"><span></span></div></div><p class="crop-hint">Потяните нижнюю границу вверх, чтобы обрезать оба изображения</p><section id="watermarks"><div class="watermark-head"><strong>Водяной знак</strong><button id="addWatermark" class="ghost" type="button">＋ Добавить</button></div><div id="watermarkCarousel" class="watermark-carousel"><button class="watermark-item selected" data-watermark="none" type="button"><span>Без</span></button></div></section><p id="error"></p></main><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden><input id="watermarkFile" type="file" accept="image/*" hidden><div id="editor" hidden><div class="editor-head"><button id="editorCancel" class="ghost">Отмена</button><strong id="editorTitle">Фото</strong><button id="editorSave">Готово</button></div><div id="stage"><img id="editImage"><img id="watermarkImage" hidden><div id="grid"><i></i><i></i><i></i><i></i></div></div><div class="editor-controls"><div><button id="gridToggle" class="ghost">Скрыть сетку</button><span id="angle">0°</span></div><input id="rotation" type="range" min="-45" max="45" step="1" value="0"><label id="opacityControl" hidden>Прозрачность <span id="opacityValue">20%</span><input id="opacity" type="range" min="0" max="100" step="1" value="20"></label><small id="editorHint">Двигайте фото одним пальцем. Масштабируйте двумя.</small></div></div><script src="/before-after.js"></script><script src="/watermark-delete.js"></script></body></html>
