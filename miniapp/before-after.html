<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>До / После</title><link rel="stylesheet" href="/before-after.css"></head><body><header><button id="back" class="ghost">← Назад</button><strong>До / После</strong><button id="finish" disabled>Сохранить</button></header><main><div class="toolbar"><button data-layout="horizontal" class="selected">Лево / право</button><button data-layout="vertical">Верх / низ</button><button id="swap">⇄ Поменять</button></div><div id="slots" data-layout="horizontal"><button class="slot" data-slot="before"><span class="label">ДО</span><span class="empty">＋<small>Добавить фото</small></span><img></button><button class="slot" data-slot="after"><span class="label">ПОСЛЕ</span><span class="empty">＋<small>Добавить фото</small></span><img></button><div id="cropHandle" aria-label="Обрезать снизу"><span></span></div></div><p class="crop-hint">Потяните нижнюю границу вверх, чтобы обрезать оба изображения</p><p id="error"></p></main><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden><div id="editor" hidden><div class="editor-head"><button id="editorCancel" class="ghost">Отмена</button><strong id="editorTitle">Фото</strong><button id="editorSave">Готово</button></div><div id="stage"><img id="editImage"><div id="grid"><i></i><i></i><i></i><i></i></div></div><div class="editor-controls"><div><button id="gridToggle" class="ghost">Скрыть сетку</button><span id="angle">0°</span></div><input id="rotation" type="range" min="-45" max="45" step="1" value="0"><small>Двигайте фото одним пальцем. Масштабируйте двумя.</small></div></div><script src="/before-after.js"></script></body></html>
