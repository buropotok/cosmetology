<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Новый пост</title><link rel="stylesheet" href="/styles.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/app.js" defer></script></head>
<body><main>
<header><p id="greeting" class="eyebrow">Telegram Mini App</p><h1>Новый пост</h1></header>
<section id="account" class="account" aria-live="polite"><strong id="account-title">Проверяем подключение…</strong><span id="account-detail">Подождите немного</span></section>
<section class="onboarding"><h2>VK-группа</h2><label for="vk-group-url">Ссылка на группу VK</label><input id="vk-group-url" type="url" inputmode="url" placeholder="https://vk.com/club123456"><button id="save-vk-group" type="button" class="secondary">Сохранить VK-группу</button><small id="vk-group-status" role="status" aria-live="polite">Вставьте ссылку вида vk.com/club123456</small></section>
<form id="publish-form"><label class="upload" for="image"><span>Выбрать фотографии</span><small>До 10 изображений, каждое до 10 МБ</small></label><input id="image" name="image" type="file" accept="image/*" multiple><div id="preview-wrap" class="preview" hidden><div id="previews" class="preview-grid"></div><button id="remove-image" type="button" class="secondary">Убрать все фотографии</button></div><label for="text">Текст публикации</label><textarea id="text" name="text" maxlength="4096" rows="7" placeholder="Введите текст публикации..."></textarea><button id="publish" type="submit" disabled>Опубликовать в Telegram</button><button id="publish-vk" type="button" class="secondary">Открыть в VK</button><p id="status" role="status" aria-live="polite"></p></form>
<section class="managed-bot-poc"><h2>Telegram</h2><p>Публикации отправляются через ваш персональный Telegram-бот.</p><button id="create-managed-bot" type="button">Создать персонального бота</button><button id="request-managed-bot" type="button" class="secondary">Создать через Telegram</button><button id="connect-managed-group" type="button" hidden>Подключить группу</button><button id="recheck-managed-group" type="button" class="secondary" hidden>Проверить группу</button><small id="managed-bot-status" role="status" aria-live="polite"></small></section>
</main></body></html>
