<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Publisher</title><link rel="stylesheet" href="sidepanel.css"></head><body><header><h1>Social Publisher</h1><nav><button data-tab="publisher">Публикация</button><button data-tab="history">История</button><button data-tab="settings">Настройки</button></nav></header><main><section id="publisher"><label>Текст<textarea id="text" rows="13" placeholder="Напишите текст публикации..."></textarea></label><div id="detected"></div><label>Изображение<input id="upload" type="file" accept="image/*"></label><img id="preview" hidden alt="Предпросмотр"><button id="removeImage" type="button">Убрать изображение</button><fieldset><legend>Площадки</legend><label><input id="vk" type="checkbox" checked> VK</label><label><input id="telegram" type="checkbox" checked> Telegram</label></fieldset><button class="primary" id="publish">Опубликовать</button><div id="results"></div></section><section id="beforeAfter" hidden><h2>До / После</h2><p class="ba-label">Макет</p><div class="ba-layouts"><button class="selected" type="button">ДО | ПОСЛЕ</button><button type="button" disabled>ДО<br>ПОСЛЕ</button></div><div class="ba-preview"><canvas id="beforeAfterCanvas" width="1080" height="1080"></canvas><div class="ba-slot" data-ba-slot="before"><span>Загрузите или<br>перетащите фото сюда</span><button type="button" data-ba-replace>Заменить</button></div><div class="ba-slot" data-ba-slot="after"><span>Загрузите или<br>перетащите фото сюда</span><button type="button" data-ba-replace>Заменить</button></div></div><input id="beforeFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><input id="afterFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><label class="ba-zoom">Масштаб ДО <b>−</b><input id="beforeZoom" type="range" min="1" max="4" step="0.01" value="1" disabled><b>+</b></label><label class="ba-zoom">Масштаб ПОСЛЕ <b>−</b><input id="afterZoom" type="range" min="1" max="4" step="0.01" value="1" disabled><b>+</b></label><p id="beforeAfterError" class="ba-error" role="status"></p><div class="ba-actions"><button id="beforeAfterSwap" type="button">⇄ Поменять местами</button><button id="beforeAfterCancel" type="button">Отмена</button><button id="beforeAfterSave" class="primary" type="button" disabled>Сохранить</button></div></section><section id="history" hidden><input id="search" type="search" placeholder="Поиск"><button id="searchButton">Найти</button><div id="cards"></div><article id="detail"></article></section><section id="settings" hidden><label>Worker Base URL<input id="workerUrl" placeholder="https://name.workers.dev"></label><label>Personal API token<input id="apiToken" type="password"></label><button class="primary" id="save">Сохранить</button><p>Токен хранится в Chrome storage и защищает только от случайного публичного использования: установленное расширение нельзя считать хранилищем секрета.</p></section></main><small id="extensionVersion" aria-label="Версия расширения"></small><script src="sidepanel.js"></script></body></html>
