<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Publisher</title><link rel="stylesheet" href="sidepanel.css"></head><body><header><h1>Social Publisher</h1><nav><button data-tab="publisher">Публикация</button><button data-tab="history">История</button><button data-tab="settings">Настройки</button></nav></header><main><section id="publisher"><label>Текст<textarea id="text" rows="13"></textarea></label><div id="detected"></div><label>Изображение<input id="upload" type="file" accept="image/*"></label><img id="preview" hidden alt="Предпросмотр"><button id="removeImage" type="button">Убрать изображение</button><fieldset><legend>Площадки</legend><label><input id="vk" type="checkbox" checked> VK</label><label><input id="telegram" type="checkbox" checked> Telegram</label></fieldset><button class="primary" id="publish">Опубликовать</button><div id="results"></div></section><section id="history" hidden><input id="search" type="search" placeholder="Поиск"><button id="searchButton">Найти</button><div id="cards"></div><article id="detail"></article></section><section id="settings" hidden><label>Worker Base URL<input id="workerUrl" placeholder="https://name.workers.dev"></label><label>Personal API token<input id="apiToken" type="password"></label><button class="primary" id="save">Сохранить</button><p>Токен хранится в Chrome storage и защищает только от случайного публичного использования: установленное расширение нельзя считать хранилищем секрета.</p></section></main><script src="sidepanel.js"></script></body></html>
