<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Публикация VK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <link rel="stylesheet" href="/miniapp/styles.css?v=20260831-2000">
</head>
<body>
  <main class="card">
    <svg class="logo" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VK">
      <rect width="72" height="72" rx="20" fill="#0077FF"/>
      <path fill="#fff" d="M38.93 51.3c-16.4 0-25.75-11.24-26.14-29.95h8.22c.27 13.73 6.32 19.55 11.11 20.75V21.35h7.75V33.2c4.73-.51 9.7-5.91 11.38-11.85H59c-1.29 7.31-6.68 12.71-10.51 14.93 3.83 1.8 9.97 6.51 12.31 15.02h-8.53c-1.83-5.7-6.38-10.12-12.4-10.72V51.3h-.94Z"/>
    </svg>
    <h1 id="title">Публикация во ВКонтакте</h1>
    <p id="subtitle" class="subtitle">Проверьте подготовленный пост и откройте публикацию во ВКонтакте.</p>

    <section id="artifact" class="artifact" hidden>
      <div id="images" class="images"></div>
      <p id="post-text" class="post-text"></p>
    </section>

    <button id="post" disabled>Открыть публикацию</button>
    <button id="test-groups" type="button">Тест: получить мои группы</button>
    <div id="status">Подготавливаем публикацию…</div>

    <details class="diagnostics" id="diagnostics">
      <summary>Диагностика</summary>
      <pre id="diagnostic-log">Лог пока пуст.</pre>
    </details>
  </main>
  <script src="/miniapp/app.js?v=20260901-0124"></script>
  <script>
    document.getElementById("test-groups").addEventListener("click", async () => {
      const button = document.getElementById("test-groups");
      const status = document.getElementById("status");
      const diagnostics = document.getElementById("diagnostics");
      const diagnosticLog = document.getElementById("diagnostic-log");
      button.disabled = true;
      status.textContent = "Запрашиваем доступ к группам…";
      try {
        const auth = await vkBridge.send("VKWebAppGetAuthToken", {
          app_id: 54742219,
          scope: "groups"
        });
        const result = await vkBridge.send("VKWebAppCallAPIMethod", {
          method: "groups.get",
          params: {
            access_token: auth.access_token,
            filter: "admin",
            extended: 1,
            count: 100,
            v: "5.199"
          }
        });
        const items = result && result.response && Array.isArray(result.response.items)
          ? result.response.items
          : [];
        const safeItems = items.map(group => ({ id: group.id, name: group.name, screen_name: group.screen_name }));
        diagnosticLog.textContent += `\n[GROUPS TEST] AUTH OK | scope=${auth.scope || "(not returned)"}`;
        diagnosticLog.textContent += `\n[GROUPS TEST] groups.get OK | count=${items.length}`;
        diagnosticLog.textContent += `\n[GROUPS TEST] ${JSON.stringify(safeItems, null, 2)}`;
        diagnostics.open = true;
        status.textContent = `Получено групп: ${items.length}`;
      } catch (error) {
        const safeError = JSON.stringify(error, (key, value) => /token/i.test(key) ? "***" : value, 2);
        diagnosticLog.textContent += `\n[GROUPS TEST] ERROR | ${safeError}`;
        diagnostics.open = true;
        status.textContent = "Тест групп завершился ошибкой";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
