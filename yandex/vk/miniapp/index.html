<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Cosmo Sofa · VK</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <link rel="stylesheet" href="/miniapp/styles.css?v=20260901-0956">
</head>
<body>
<main class="settings-screen">
  <header class="settings-header"><span></span><h1>Настройки</h1><span></span></header>
  <div class="onboarding-progress" aria-hidden="true"><span></span><span></span><span></span><span class="active"></span><span></span></div>

  <section id="picker-view">
    <div class="onboarding-hero">
      <div class="onboarding-logo"><svg viewBox="0 0 64 64" aria-label="VK"><rect width="64" height="64" rx="16" fill="#0077FF"/><path fill="#fff" d="M34.8 44C20.2 44 11.9 34 11.5 17.4h7.3c.2 12.2 5.6 17.4 9.8 18.5V17.4h6.9V28c4.1-.4 8.4-5.2 9.9-10.6h6.9c-1.1 6.7-5.9 11.5-9.3 13.5 3.4 1.6 8.8 5.8 10.9 13.1h-7.6c-1.7-5.2-5.6-9.2-10.8-9.7V44h-.7Z"/></svg></div>
      <h2>Группа ВКонтакте</h2>
      <p>Выберите группу, в которую Cosmo Sofa будет передавать готовые публикации.</p>
    </div>
    <div id="groups" class="group-list" hidden></div>
    <p id="status" class="status">Подготавливаем список…</p>
  </section>

  <section id="success-view" hidden>
    <div class="onboarding-hero">
      <div class="success-icon">✓</div>
      <h2>Группа выбрана</h2>
      <p>Настройка ВКонтакте сохранена.</p>
    </div>
    <section class="onboarding-step-card">
      <div class="onboarding-state-row">
        <div><span class="detail-label">Группа для публикаций</span><strong id="selected-group-name">—</strong><span id="selected-group-url" class="detail-label"></span></div>
        <span class="state-badge ready">Подключена</span>
      </div>
    </section>
    <button id="close-vk-onboarding" class="onboarding-primary" type="button">Закрыть</button>
    <p class="return-note">После закрытия вернитесь в Telegram.</p>
  </section>

  <details class="diagnostics" id="diagnostics"><summary>Диагностика</summary><pre id="diagnostic-log"></pre></details>
</main>

</body>
</html>
